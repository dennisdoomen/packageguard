version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      all-actions:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Verify.DiffPlex versions beyond 3.1.2 require a newer Verify core package
      # than the one Verify.Xunit 31.12.5 was built against, which causes a
      # MethodAccessException in the API approval tests at runtime (see PR #204
      # and PR #228). Remove this once Verify.Xunit ships a release compatible
      # with a newer Verify.DiffPlex, and bump both together.
      - dependency-name: "Verify.DiffPlex"
        versions: [">3.1.2"]

      # Microsoft.Build 18.x no longer restores for net9.0/net10.0 without falling back to .NET Framework
      # assemblies (NU1701, an error here), and drags in Microsoft.IO.Redist (see PR #347). Stay on 17.x until a
      # release restores cleanly for the target frameworks.
      - dependency-name: "Microsoft.Build"
        update-types: ["version-update:semver-major"]
